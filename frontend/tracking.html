<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeLine — Tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --red:        #C62828;
      --red-dark:   #B71C1C;
      --red-light:  #FFEBEE;
      --red-mid:    #EF9A9A;
      --navy:       #0D1B2A;
      --white:      #FFFFFF;
      --off-white:  #F8F9FB;
      --gray-100:   #E8EAED;
      --gray-200:   #D1D5DB;
      --gray-400:   #9CA3AF;
      --gray-600:   #4B5563;
      --gray-800:   #1F2937;
      --success:    #1B7A3E;
      --success-bg: #E6F4EC;
      --success-bdr:#A7D7B8;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--off-white);
      color: var(--gray-800);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--navy);
      padding: 13px 16px;
      display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 100;
    }
    .back-btn {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer;
      text-decoration: none; color: rgba(255,255,255,0.80);
      transition: background 0.15s; flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,0.14); }
    .header-logo {
      width: 34px; height: 34px;
      background: var(--red); border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      position: relative; flex-shrink: 0;
    }
    .header-logo .cv, .header-logo .ch {
      position: absolute; background: #fff; border-radius: 1.5px;
    }
    .header-logo .cv { width: 6px; height: 18px; }
    .header-logo .ch { width: 18px; height: 6px; }
    .header-info { flex: 1; min-width: 0; }
    .header-info h1 { font-size: 15px; font-weight: 800; color: var(--white); }
    .header-info p  { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 1px; }

    /* refresh badge in header */
    .refresh-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;
      padding: 5px 10px;
      flex-shrink: 0;
    }
    .refresh-badge span {
      font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
    }
    #countdown-ring {
      width: 16px; height: 16px;
      flex-shrink: 0;
    }

    /* ── Map ── */
    #map { height: 38vh; width: 100%; }

    /* ── Status banner ── */
    .status-banner {
      background: var(--white);
      border-bottom: 1.5px solid var(--gray-100);
      padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .status-icon {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .status-icon.active  { background: var(--success-bg); }
    .status-icon.pending { background: var(--red-light); }
    .status-text { font-size: 14px; font-weight: 800; color: var(--gray-800); }
    .status-sub  { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
    .live-chip {
      margin-left: auto; flex-shrink: 0;
      display: flex; align-items: center; gap: 5px;
      background: var(--success-bg);
      border: 1px solid var(--success-bdr);
      border-radius: 20px; padding: 4px 10px;
      font-size: 11px; font-weight: 700; color: var(--success);
    }
    .live-dot {
      width: 7px; height: 7px;
      background: var(--success); border-radius: 50%;
      animation: blink 1.4s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── ETA banner ── */
    .eta-banner {
      background: var(--red-light);
      border: 1.5px solid var(--red-mid);
      border-radius: 14px;
      margin: 12px 16px 0;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .eta-icon {
      width: 46px; height: 46px;
      background: var(--red); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .eta-label { font-size: 12px; color: var(--red-dark); font-weight: 600; margin-bottom: 2px; }
    .eta-row   { display: flex; align-items: baseline; gap: 4px; }
    .eta-num   { font-size: 28px; font-weight: 900; color: var(--red); line-height: 1; }
    .eta-unit  { font-size: 13px; color: var(--red-dark); font-weight: 700; }

    /* ── Cards ── */
    .card {
      background: var(--white);
      margin: 12px 16px 0;
      border-radius: 14px;
      border: 1.5px solid var(--gray-100);
      overflow: hidden;
    }
    .card-hdr {
      padding: 12px 16px;
      border-bottom: 1.5px solid var(--gray-100);
      font-size: 11px; font-weight: 700;
      color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.8px;
    }

    /* ── Progress steps ── */
    .steps { padding: 14px 16px; display: flex; flex-direction: column; }
    .step-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding-bottom: 16px; position: relative;
    }
    .step-row:last-child { padding-bottom: 0; }
    /* connector line */
    .step-row::before {
      content: '';
      position: absolute; left: 11px; top: 25px;
      width: 2px; height: calc(100% - 11px);
      background: var(--gray-100);
    }
    .step-row:last-child::before { display: none; }
    .step-row.done::before   { background: var(--success); }
    .step-row.active::before { background: linear-gradient(to bottom, var(--red), var(--gray-100)); }

    .step-circle {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid var(--gray-200);
      background: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 900; color: var(--gray-400);
      flex-shrink: 0; z-index: 1;
      transition: background 0.3s, border-color 0.3s;
    }
    .step-row.done   .step-circle { background: var(--success);  border-color: var(--success);  color: #fff; }
    .step-row.active .step-circle { background: var(--red);      border-color: var(--red);      color: #fff;
      box-shadow: 0 0 0 4px rgba(198,40,40,0.15); animation: pulse-step 1.8s infinite; }
    @keyframes pulse-step { 0%,100%{box-shadow:0 0 0 3px rgba(198,40,40,0.15)} 50%{box-shadow:0 0 0 7px rgba(198,40,40,0.05)} }

    .step-content { padding-top: 3px; }
    .step-label { font-size: 13px; font-weight: 700; color: var(--gray-400); }
    .step-row.done   .step-label { color: var(--success); }
    .step-row.active .step-label { color: var(--red); }

    /* ── Info rows ── */
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid var(--gray-100);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { font-size: 13px; color: var(--gray-400); }
    .info-value { font-size: 13px; font-weight: 700; color: var(--gray-800); text-align: right; }

    /* ── Pending card ── */
    .pending-card {
      background: var(--white);
      margin: 12px 16px 0;
      border-radius: 14px;
      border: 1.5px solid var(--gray-100);
      padding: 36px 20px; text-align: center;
    }
    .pending-icon {
      width: 68px; height: 68px;
      background: var(--red-light); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin: 0 auto 14px;
      animation: spin-slow 3s linear infinite;
    }
    @keyframes spin-slow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .pending-card h3 { font-size: 17px; font-weight: 800; color: var(--gray-800); margin-bottom: 6px; }
    .pending-card p  { font-size: 13px; color: var(--gray-400); line-height: 1.6; }
    .req-id-badge {
      display: inline-block;
      background: var(--off-white); border: 1px solid var(--gray-100);
      border-radius: 8px; padding: 6px 12px;
      font-size: 12px; font-weight: 700; color: var(--gray-600);
      margin-top: 12px;
    }

    /* ── Last updated ── */
    .last-updated {
      text-align: center;
      font-size: 11px; color: var(--gray-400);
      padding: 12px 16px 4px;
    }

    /* ── Cancel ── */
    .cancel-wrap { padding: 12px 16px 32px; }
    .cancel-btn {
      width: 100%; padding: 14px; border-radius: 11px;
      border: 1.5px solid var(--red-mid);
      background: var(--red-light); color: var(--red);
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: background 0.15s; font-family: var(--font);
    }
    .cancel-btn:hover { background: #FFCDD2; }

    /* ── Completed banner ── */
    .completed-card {
      background: var(--success-bg);
      border: 1.5px solid var(--success-bdr);
      border-radius: 14px;
      margin: 12px 16px 0;
      padding: 24px 20px; text-align: center;
    }
    .completed-card h3 { font-size: 18px; font-weight: 800; color: var(--success); margin-bottom: 6px; }
    .completed-card p  { font-size: 13px; color: var(--success); opacity: 0.85; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="header">
    <a href="#" class="back-btn" onclick="goBack(event)">←</a>
    <div class="header-logo"><div class="cv"></div><div class="ch"></div></div>
    <div class="header-info">
      <h1>Ambulance Tracking</h1>
      <p id="req-id-label">Request ID: —</p>
    </div>
    <div class="refresh-badge">
      <svg id="countdown-ring" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="6" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
        <circle id="ring-arc" cx="8" cy="8" r="6" fill="none"
          stroke="rgba(255,255,255,0.70)" stroke-width="2"
          stroke-dasharray="37.7" stroke-dashoffset="0"
          stroke-linecap="round"
          transform="rotate(-90 8 8)"/>
      </svg>
      <span id="countdown-label">2:00</span>
    </div>
  </div>

  <div id="map"></div>
  <div id="tracking-content"></div>
  <p class="last-updated" id="last-updated"></p>

  <script>
  (function () {
    /* ── constants ── */
    const REFRESH_MS  = 3000; // 10 seconds — matches driver/hospital poll rate
    const STEP_LABELS = [
      'Request Received',
      'Ambulance Assigned',
      'En Route to You',
      'Driver Arrived',
      'Patient Picked Up',
      'En Route to Hospital',
      'Arrived at Hospital'
    ];
    const STATUS_TEXT = {
      pending:   { text: 'Finding Ambulance…',  sub: 'Searching for the nearest available unit' },
      active:    { text: 'Ambulance Assigned',   sub: 'Driver has been dispatched to your location' },
      accepted:  { text: 'Driver Accepted',      sub: 'Driver confirmed — heading your way' },
      en_route:  { text: 'Ambulance En Route',   sub: 'Driver is on the way to your location' },
      arrived:   { text: 'Driver Arrived',        sub: 'The ambulance has reached your location' },
      picked_up: { text: 'Patient On Board',      sub: 'En route to the hospital' },
      completed: { text: 'Trip Completed',        sub: 'You have arrived at the hospital' },
    };

    /* ── state ── */
    let data      = JSON.parse(sessionStorage.getItem('active_request') || '{}');
    let requestId = data.request_id || data.id || null;
    let map, ambMarker, patMarker, routeLine;
    let countdownTimer, countdownLeft;

    document.getElementById('req-id-label').textContent = 'Request ID: ' + (requestId || '—');

    /* ── map init ── */
    const initLat = data.ambulance?.latitude  || data.patient?.latitude  || 13.028;
    const initLon = data.ambulance?.longitude || data.patient?.longitude || 77.6;
    map = L.map('map', { zoomControl: false, attributionControl: false }).setView([initLat, initLon], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    /* ── marker helpers ── */
    const ambIcon = L.divIcon({
      html: '<div style="font-size:26px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))">🚑</div>',
      iconSize: [32, 32], iconAnchor: [16, 16], className: ''
    });
    const patIcon = L.divIcon({
      html: '<div style="width:14px;height:14px;background:#C62828;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(198,40,40,.5)"></div>',
      iconSize: [14, 14], iconAnchor: [7, 7], className: ''
    });
    const hospIcon = L.divIcon({
      html: '<div style="font-size:24px;line-height:1">🏥</div>',
      iconSize: [28, 28], iconAnchor: [14, 14], className: ''
    });

    function placeAmbMarker(lat, lon) {
      if (!ambMarker) { ambMarker = L.marker([lat, lon], { icon: ambIcon }).addTo(map).bindPopup('🚑 Ambulance'); }
      else            { ambMarker.setLatLng([lat, lon]); }
    }
    function placePatMarker(lat, lon) {
      if (!patMarker) { patMarker = L.marker([lat, lon], { icon: patIcon }).addTo(map).bindPopup('📍 Your Location'); }
      else            { patMarker.setLatLng([lat, lon]); }
    }
    function drawRoute(a, b) {
      if (routeLine) routeLine.remove();
      routeLine = L.polyline([a, b], { color: '#C62828', weight: 4, opacity: 0.7, dashArray: '8 6' }).addTo(map);
      map.fitBounds(routeLine.getBounds().pad(0.18));
    }

    /* ── render ── */
    function render(d) {
      const content   = document.getElementById('tracking-content');
      const step      = typeof d.step === 'number' ? d.step : 0;
      const status    = d.status || 'pending';
      const st        = STATUS_TEXT[status] || STATUS_TEXT.pending;
      const amb       = d.ambulance;
      const hosp      = d.hospital;
      const etaMins   = d.eta_minutes;
      const assigned  = d.ambulance_assigned;

      /* map markers */
      if (amb?.latitude) placeAmbMarker(amb.latitude, amb.longitude);
      if (d.patient?.latitude) placePatMarker(d.patient.latitude, d.patient.longitude);
      if (amb?.latitude && d.patient?.latitude && status !== 'completed') {
        drawRoute([amb.latitude, amb.longitude], [d.patient.latitude, d.patient.longitude]);
      }

      /* completed */
      if (status === 'completed') {
        content.innerHTML = `
          <div class="completed-card">
            <div style="font-size:44px;margin-bottom:10px">✅</div>
            <h3>Trip Completed</h3>
            <p>You have arrived at the hospital.<br>Stay safe and get well soon.</p>
          </div>
          <div class="cancel-wrap">
            <button class="cancel-btn" onclick="goHome()">← Back to Home</button>
          </div>`;
        return;
      }

      /* pending – no ambulance yet */
      if (!assigned) {
        content.innerHTML = `
          <div class="status-banner">
            <div class="status-icon pending">🔍</div>
            <div>
              <div class="status-text">${st.text}</div>
              <div class="status-sub">${st.sub}</div>
            </div>
          </div>
          <div class="pending-card">
            <div class="pending-icon">🔄</div>
            <h3>Finding Ambulance…</h3>
            <p>All nearby ambulances are currently busy.<br>You are in the queue — we'll assign one shortly.</p>
            <div class="req-id-badge">Request ID: ${d.request_id}</div>
          </div>
          <div class="cancel-wrap">
            <button class="cancel-btn" onclick="cancelRequest()">Cancel Request</button>
          </div>`;
        return;
      }

      /* assigned */
      const stepsHtml = STEP_LABELS.map((label, i) => {
        const cls = i < step ? 'done' : i === step ? 'active' : '';
        const icon = i < step ? '✓' : i === step ? '→' : (i + 1);
        return `<div class="step-row ${cls}">
          <div class="step-circle">${icon}</div>
          <div class="step-content"><div class="step-label">${label}</div></div>
        </div>`;
      }).join('');

      content.innerHTML = `
        <div class="status-banner">
          <div class="status-icon active">${step >= 5 ? '🏥' : '🚑'}</div>
          <div>
            <div class="status-text">${st.text}</div>
            <div class="status-sub">${st.sub}</div>
          </div>
          <div class="live-chip"><div class="live-dot"></div>Live</div>
        </div>

        ${etaMins != null ? `
        <div class="eta-banner">
          <div class="eta-icon">⏱</div>
          <div>
            <div class="eta-label">Estimated Arrival</div>
            <div class="eta-row">
              <span class="eta-num" id="eta-display">${etaMins}</span>
              <span class="eta-unit">min away</span>
            </div>
          </div>
        </div>` : ''}

        <div class="card">
          <div class="card-hdr">Trip Progress</div>
          <div class="steps">${stepsHtml}</div>
        </div>

        <div class="card" style="margin-top:12px">
          <div class="card-hdr">Ambulance Details</div>
          <div class="info-row">
            <span class="info-label">Ambulance ID</span>
            <span class="info-value">${amb?.id ?? '—'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Driver</span>
            <span class="info-value">${amb?.driver_name || amb?.driver || '—'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Hospital</span>
            <span class="info-value">${hosp?.name ?? d.hospital?.name ?? '—'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Request ID</span>
            <span class="info-value">${d.request_id}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Status</span>
            <span class="info-value" style="color:var(--red);text-transform:capitalize">${status.replace(/_/g,' ')}</span>
          </div>
        </div>

        <div class="cancel-wrap">
          <button class="cancel-btn" onclick="cancelRequest()">Cancel Request</button>
        </div>`;
    }

    /* ── poll ── */
    async function poll() {
      if (!requestId) return;
      try {
        const res = await fetch(`/api/patient/request-status/${encodeURIComponent(requestId)}`);
        if (!res.ok) throw new Error('status ' + res.status);
        const fresh = await res.json();

        /* merge back request_id for template */
        fresh.request_id = fresh.request_id || requestId;

        /* update sessionStorage so a page reload doesn't lose data */
        const stored = JSON.parse(sessionStorage.getItem('active_request') || '{}');
        sessionStorage.setItem('active_request', JSON.stringify({ ...stored, ...fresh }));

        data = fresh;
        render(fresh);

        const now = new Date();
        document.getElementById('last-updated').textContent =
          'Last updated ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      } catch (e) {
        console.warn('poll error', e.message);
        document.getElementById('last-updated').textContent =
          'Update failed — retrying in 2 min';
      }
    }

    /* ── countdown ring ── */
    function startCountdown() {
      clearInterval(countdownTimer);
      countdownLeft = REFRESH_MS / 1000; // 3 s
      const arc      = document.getElementById('ring-arc');
      const label    = document.getElementById('countdown-label');
      const circ     = 37.7; // 2πr where r=6

      function tick() {
        countdownLeft--;
        const frac   = countdownLeft / (REFRESH_MS / 1000);
        const offset = circ * (1 - frac);
        arc.setAttribute('stroke-dashoffset', offset.toFixed(2));
        const m = Math.floor(countdownLeft / 60);
        const s = countdownLeft % 60;
        label.textContent = m + ':' + String(s).padStart(2, '0');
        if (countdownLeft <= 0) {
          poll();
          startCountdown();
        }
      }
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    /* ── cancel confirm modal ── */
    function buildCancelModal() {
      if (document.getElementById('cancel-modal')) return;
      const overlay = document.createElement('div');
      overlay.id = 'cancel-modal';
      overlay.style.cssText = `
        display:none; position:fixed; inset:0;
        background:rgba(13,27,42,0.60); z-index:500;
        align-items:center; justify-content:center; padding:24px;`;
      overlay.innerHTML = `
        <div style="background:#fff;border-radius:18px;padding:28px 24px;width:100%;max-width:320px;
                    box-shadow:0 16px 48px rgba(0,0,0,0.22);font-family:-apple-system,sans-serif;text-align:center">
          <div style="font-size:40px;margin-bottom:12px">🚑</div>
          <div style="font-size:17px;font-weight:800;color:#0D1B2A;margin-bottom:8px">Cancel Request?</div>
          <div style="font-size:13px;color:#6B7280;line-height:1.6;margin-bottom:22px">
            Are you sure you want to cancel this ambulance request?<br>The assigned driver will be notified.
          </div>
          <div style="display:flex;gap:10px">
            <button id="cancel-no"
              style="flex:1;padding:13px;border-radius:10px;border:1.5px solid #E8EAED;
                     background:#F8F9FB;font-size:14px;font-weight:700;cursor:pointer;
                     color:#374151;font-family:inherit">
              Keep It
            </button>
            <button id="cancel-yes"
              style="flex:1;padding:13px;border-radius:10px;border:none;
                     background:#C62828;font-size:14px;font-weight:700;cursor:pointer;
                     color:#fff;font-family:inherit">
              Yes, Cancel
            </button>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      document.getElementById('cancel-no').onclick  = () => { overlay.style.display = 'none'; };
      document.getElementById('cancel-yes').onclick = () => {
        overlay.style.display = 'none';
        doCancel();
      };
    }

    function showCancelModal() {
      buildCancelModal();
      document.getElementById('cancel-modal').style.display = 'flex';
    }

    async function doCancel() {
      /* Show loading state on the button */
      const yesBtn = document.getElementById('cancel-yes');
      if (yesBtn) { yesBtn.disabled = true; yesBtn.textContent = 'Cancelling…'; }

      const rid = requestId || (data && data.request_id);

      /* 1. Tell the backend FIRST — wait for it to finish */
      if (rid) {
        try {
          const res = await fetch('/api/patient/cancel-request', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ request_id: rid })
          });
          if (!res.ok) console.warn('cancel backend error', res.status);
        } catch (e) {
          console.warn('cancel network error', e.message);
        }
      }

      /* 2. Clear active request AND mark flags so
            index.html does NOT re-redirect on this load */
      sessionStorage.removeItem('active_request');
      sessionStorage.setItem('just_cancelled', '1');
      sessionStorage.setItem('just_went_back', '1');

      /* 3. Stop the countdown so poll() never fires again */
      clearInterval(countdownTimer);

      /* 4. Navigate */
      window.location.replace('/patient');
    }

    /* ── back button (header ←) ── */
    window.goBack = function (e) {
      e.preventDefault();
      const status = data && data.status;
      // If request is active (driver assigned), ask before leaving
      if (status && !['pending', 'cancelled', 'completed'].includes(status)) {
        showCancelModal();
      } else {
        // Pending or no active trip — just go back safely
        sessionStorage.removeItem('active_request');
        sessionStorage.setItem('just_went_back', '1');
        window.location.replace('/patient');
      }
    };

    /* ── cancel / home ── */
    window.cancelRequest = function () { showCancelModal(); };

    window.goHome = function () {
      sessionStorage.removeItem('active_request');
      sessionStorage.setItem('just_went_back', '1');  // prevent re-redirect
      window.location.replace('/patient');
    };

    /* ── boot ── */
    render(data); // immediate render from sessionStorage
    poll();       // then fetch fresh data right away
    startCountdown();
  })();
  </script>
</body>
</html>
